<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#d33824"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#450a0a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>

  <!-- Inner delicate ring -->
  <circle cx="256" cy="236" r="150" fill="#fff" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Core Mascot / Emoji -->
  <text x="256" y="270" font-size="140" text-anchor="middle" dominant-baseline="central">👨‍👩‍👦</text>

  <!-- Bottom Badge Text -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-28" width="280" height="56" rx="28" fill="#1e1e1e" fill-opacity="0.45" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">中国式家长</text>
  </g>
</svg>
