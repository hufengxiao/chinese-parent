<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧧 过年收红包 · 专项测试实验室 (Hongbao Sandbox)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 40px;
      background: var(--bg-gradient);
      min-height: 100vh;
    }
    .sandbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-line);
    }
    .sandbox-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sandbox-tag {
      font-size: 11px;
      background: var(--red-light);
      color: var(--red-main);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(211, 56, 36, 0.25);
    }
    .lab-panel {
      background: #ffffff;
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .lab-panel-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    @media (max-width: 500px) {
      .control-grid { grid-template-columns: 1fr; }
    }
    .form-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-item label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
    }
    .form-item select, .form-item input {
      padding: 8px 10px;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      font-size: 13px;
      background: var(--card-subtle);
      color: var(--ink-primary);
      outline: none;
      transition: border 0.15s;
    }
    .form-item select:focus, .form-item input:focus {
      border-color: var(--gold-main);
    }
    .custom-params-box {
      background: var(--card-subtle);
      border: 1px dashed var(--border-line);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      display: none;
    }
    .custom-params-box.active {
      display: block;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      margin: 0 10px;
    }
    .btn-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-bar .btn {
      flex: 1;
    }

    /* 实战游戏渲染容器 */
    #hb-stage-wrap {
      background: #ffffff;
      border: 2px solid var(--gold-main);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(223, 152, 36, 0.12);
      min-height: 280px;
      position: relative;
    }
    #hb-stage-wrap .hb-modal {
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* 实时遥测仪表盘 */
    .telemetry-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 500px) {
      .telemetry-row { grid-template-columns: 1fr 1fr; }
    }
    .tele-card {
      background: var(--card-subtle);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .tele-label {
      font-size: 11px;
      color: var(--ink-secondary);
      margin-bottom: 2px;
    }
    .tele-val {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-primary);
    }
    .tele-val.good { color: #2e7d32; }
    .tele-val.warn { color: #1976d2; }
    .tele-val.danger { color: #c62828; }

    /* 测试统计与日志 */
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }
    .stats-table th, .stats-table td {
      padding: 6px 8px;
      border: 1px solid var(--border-line);
    }
    .stats-table th {
      background: var(--card-subtle);
      color: var(--ink-secondary);
    }
    .history-log {
      max-height: 180px;
      overflow-y: auto;
      font-size: 12px;
      margin-top: 10px;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 8px;
      background: #faf8f5;
    }
    .log-entry {
      padding: 4px 6px;
      border-bottom: 1px dashed var(--border-line);
      display: flex;
      justify-content: space-between;
    }
    .log-entry:last-child { border-bottom: none; }
    .key-badge {
      display: inline-block;
      padding: 1px 5px;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- 顶栏标题与回退 -->
  <div class="sandbox-header">
    <div class="sandbox-title">
      <span>🧧 红包推拉博弈 · 专项测试实验室</span>
      <span class="sandbox-tag">v2.5.0 Sandbox</span>
    </div>
    <a href="index.html" class="btn small ghost" title="返回游戏主界面">🏠 返回游戏</a>
  </div>

  <!-- 参数配置与调度面板 -->
  <div class="lab-panel">
    <div class="lab-panel-title">
      <span>⚙️ 关卡与物理参数配置</span>
      <span style="font-size:11px; font-weight:normal; color:var(--ink-secondary)">快捷键: <span class="key-badge">R</span> 快速重置测试</span>
    </div>

    <div class="control-grid">
      <div class="form-item">
        <label for="sel-rel">亲戚角色 (性格 Profile)</label>
        <select id="sel-rel">
          <option value="0">大姑妈 (猛塞进兜 · 持续偏右推 · 阵风冲刺)</option>
          <option value="1">二叔叔 (欲迎还拒 · 假意缩手 · 暗中收回)</option>
          <option value="2">表舅爷 (大开大合 · 双频强振荡 · 决胜暴击)</option>
          <option value="3">隔壁王阿姨 (书香门第 · 超窄黄金区 · 高频微抖)</option>
        </select>
      </div>

      <div class="form-item">
        <label for="sel-diff">人生阶段 / 难度系数</label>
        <select id="sel-diff">
          <option value="0.8">👶 幼儿期 (0.8x 难度 · 宽容度 32%)</option>
          <option value="1.0" selected>🎒 中小学期 (1.0x 难度 · 黄金区 24%)</option>
          <option value="1.35">🎓 高中冲刺期 (1.35x 极难 · 黄金区 18%)</option>
          <option value="custom">🛠️ 自定义极限参数</option>
        </select>
      </div>

      <div class="form-item">
        <label for="sel-time">博弈倒计时时长</label>
        <select id="sel-time">
          <option value="8.0" selected>8.0 秒 (官方重塑标准版 · 充裕拔河)</option>
          <option value="5.0">5.0 秒 (紧凑冲刺模式)</option>
          <option value="12.0">12.0 秒 (持久拉扯攻防战)</option>
          <option value="999.0">999 秒 (无限时长手感练习)</option>
        </select>
      </div>

      <div class="form-item">
        <label for="sel-pos">初始生成位置 (脱位测试)</label>
        <select id="sel-pos">
          <option value="auto" selected>🎲 自动根据亲戚生成 (20%~28% 或 76%~82%)</option>
          <option value="20">✋ 左侧拒收边缘 (20%)</option>
          <option value="52">🌟 黄金中心 (52% 旧版躺赢位测试)</option>
          <option value="80">🤲 右侧急切边缘 (80%)</option>
        </select>
      </div>
    </div>

    <!-- 自定义高级滑块 -->
    <div id="custom-box" class="custom-params-box">
      <div class="slider-row">
        <span>黄金区间宽度: <b id="val-c-width">24%</b></span>
        <input type="range" id="rng-c-width" min="10" max="45" value="24">
      </div>
      <div class="slider-row">
        <span>黄金区间中心: <b id="val-c-center">52%</b></span>
        <input type="range" id="rng-c-center" min="30" max="70" value="52">
      </div>
      <div class="slider-row">
        <span>双向振荡力度: <b id="val-c-amp">3.5</b></span>
        <input type="range" id="rng-c-amp" min="10" max="70" value="35">
      </div>
    </div>

    <div class="btn-bar">
      <button id="btn-start-test" class="btn primary">🚀 启动本轮红包测试</button>
      <button id="btn-random-test" class="btn secondary">🎲 随机亲戚即兴测试</button>
    </div>
  </div>

  <!-- 实时动力学遥测看板 -->
  <div class="telemetry-row">
    <div class="tele-card">
      <div class="tele-label">实时刻度位置</div>
      <div class="tele-val" id="tele-pos">-- %</div>
    </div>
    <div class="tele-card">
      <div class="tele-label">物理速度 (阻尼)</div>
      <div class="tele-val" id="tele-vel">--</div>
    </div>
    <div class="tele-card">
      <div class="tele-label">当前落点状态</div>
      <div class="tele-val" id="tele-zone">待开始</div>
    </div>
    <div class="tele-card">
      <div class="tele-label">倒计时与冲刺</div>
      <div class="tele-val" id="tele-time">-- s</div>
    </div>
  </div>

  <!-- 实战对决渲染主舞台 -->
  <div id="hb-stage-wrap">
    <div id="hb-sandbox-mount" style="width:100%"></div>
  </div>

  <!-- 测试战绩与统计分析 -->
  <div class="lab-panel">
    <div class="lab-panel-title">
      <span>📊 累计测试战绩与胜率统计</span>
      <button id="btn-clear-stats" class="mini-btn ghost">清空战绩</button>
    </div>

    <table class="stats-table">
      <thead>
        <tr>
          <th>测试场次</th>
          <th>🌟 进退得体</th>
          <th>✋ 推脱过猛(0元)</th>
          <th>🤲 过于急切(扣面子)</th>
          <th>平均压岁钱</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="st-total">0</td>
          <td id="st-perfect" style="color:#2e7d32">0 (0%)</td>
          <td id="st-refuse" style="color:#1976d2">0 (0%)</td>
          <td id="st-greed" style="color:#c62828">0 (0%)</td>
          <td id="st-money">0 元</td>
        </tr>
      </tbody>
    </table>

    <div class="history-log" id="history-log">
      <div style="color:var(--ink-secondary); text-align:center; padding:12px;">暂无测试记录，点击上方“启动本轮红包测试”开始！</div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal" class="modal"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // 确保内核与数据初始化
    CP.newGame();
    const rawCPResolve = CP.resolve;

    const relativesData = [
      {
        n: '大姑妈',
        line: '“哎呀小宝又长高了！拿着，大姑给买新书包的！”',
        mom: '“使不得使不得，大姐你留着买菜！”',
        driftBias: 0.6,
        waveAmp1: 3.6,
        waveAmp2: 1.8,
        waveFreq1: 0.075,
        goldenCenter: 56,
        goldenWidth: 26,
        startPos: 24,
        gustChance: 0.35,
        gustText: '大姑妈猛地往你羽绒服口袋一塞：“拿着买肉吃！”',
        amountBase: 240
      },
      {
        n: '二叔叔',
        line: '“小男子汉/漂亮姑娘！二叔给的压岁钱，必须收着！”',
        mom: '“二弟你太客气了，小孩子不能惯着！”',
        driftBias: -0.5,
        waveAmp1: 3.3,
        waveAmp2: 2.0,
        waveFreq1: 0.07,
        goldenCenter: 62,
        goldenWidth: 28,
        startPos: 78,
        gustChance: 0.4,
        gustText: '二叔顺坡下驴往回缩：“哎呀孩子不要那就算了……”',
        amountBase: 200
      },
      {
        n: '表舅爷',
        line: '“舅爷的一点心意！好好读书考大学！”',
        mom: '“舅爷快收回去，我们怎么能要您的钱！”',
        driftBias: 0.1,
        waveAmp1: 4.6,
        waveAmp2: 2.4,
        waveFreq1: 0.085,
        goldenCenter: 50,
        goldenWidth: 22,
        startPos: 20,
        gustChance: 0.45,
        gustText: '表舅爷爽朗大喝：“读书人的事！谁也别拦着！”',
        amountBase: 280
      },
      {
        n: '隔壁王阿姨',
        line: '“压岁钱给孩子讨个好彩头，大吉大利！”',
        mom: '“王姐真不用，平时承蒙您多关照了！”',
        driftBias: 0.2,
        waveAmp1: 2.6,
        waveAmp2: 1.4,
        waveFreq1: 0.095,
        goldenCenter: 52,
        goldenWidth: 18,
        startPos: 26,
        gustChance: 0.25,
        gustText: '王阿姨笑盈盈地打量着你的神色反应……',
        amountBase: 210
      }
    ];

    // 统计数据
    let stats = {
      total: 0,
      perfect: 0,
      refuse: 0,
      greed: 0,
      normal: 0,
      totalMoney: 0,
      history: []
    };

    // 遥测监控定时器
    let teleTimer = null;

    // 自定义滑块绑定
    const selDiff = document.getElementById('sel-diff');
    const customBox = document.getElementById('custom-box');
    selDiff.onchange = () => {
      customBox.classList.toggle('active', selDiff.value === 'custom');
    };
    document.getElementById('rng-c-width').oninput = (e) => {
      document.getElementById('val-c-width').innerText = e.target.value + '%';
    };
    document.getElementById('rng-c-center').oninput = (e) => {
      document.getElementById('val-c-center').innerText = e.target.value + '%';
    };
    document.getElementById('rng-c-amp').oninput = (e) => {
      document.getElementById('val-c-amp').innerText = (e.target.value / 10).toFixed(1);
    };

    function startSandboxTest(relIdx = null) {
      if (relIdx === null) {
        relIdx = parseInt(document.getElementById('sel-rel').value, 10) || 0;
      } else {
        document.getElementById('sel-rel').value = relIdx;
      }

      const relProto = relativesData[relIdx];
      let diff = 1.0;
      let gWidth = relProto.goldenWidth;
      let gCenter = relProto.goldenCenter;
      let waveAmp1 = relProto.waveAmp1;

      if (selDiff.value === 'custom') {
        gWidth = parseInt(document.getElementById('rng-c-width').value, 10);
        gCenter = parseInt(document.getElementById('rng-c-center').value, 10);
        waveAmp1 = parseFloat(document.getElementById('rng-c-amp').value) / 10;
      } else {
        diff = parseFloat(selDiff.value) || 1.0;
        gWidth = Math.round(relProto.goldenWidth / diff);
      }

      const halfW = Math.round(gWidth / 2);
      const gMin = Math.max(15, Math.min(75, gCenter - halfW));
      const gMax = Math.min(85, Math.max(gMin + 12, gCenter + halfW));

      let startPos = relProto.startPos;
      const posOpt = document.getElementById('sel-pos').value;
      if (posOpt !== 'auto') {
        startPos = parseInt(posOpt, 10);
      }

      const totalTime = parseFloat(document.getElementById('sel-time').value) || 8.0;

      const eventPayload = {
        type: 'hongbao_duel',
        title: '🧧 过年收红包 · 实验室测试 (' + relProto.n + ')',
        rel: relProto.n,
        quote: relProto.line,
        momQuote: relProto.mom,
        body: relProto.n + '递过一个沉甸甸的红信封！',
        driftBias: relProto.driftBias,
        waveAmp1: waveAmp1,
        waveAmp2: relProto.waveAmp2,
        waveFreq1: relProto.waveFreq1,
        totalTime: totalTime,
        goldenMin: gMin,
        goldenMax: gMax,
        goldenCenter: gCenter,
        goldenWidth: gWidth,
        startPos: startPos,
        gustChance: relProto.gustChance,
        gustText: relProto.gustText,
        amountBase: relProto.amountBase,
        difficulty: diff
      };

      // 保证 state pending 队列首位为当前事件
      CP.state().pending = [eventPayload];

      // 劫持 CP.resolve，记录战报与统计
      CP.resolve = function(arg) {
        const resText = rawCPResolve.apply(this, arguments);
        recordTestResult(eventPayload, arg, resText);
        return resText;
      };

      // 测试对决结束回调，避免触发主界面全量渲染，展现沙盒战报卡片
      eventPayload.onFinish = function(posVal, isSkip, resText) {
        renderSandboxSummary(eventPayload, posVal, isSkip, resText);
      };

      // 挂载到沙盒主舞台
      const mount = document.getElementById('hb-sandbox-mount');
      const renderFn = window.renderHongbaoModal || (window.UI && window.UI.renderHongbaoModal);
      if (typeof renderFn === 'function') {
        renderFn(eventPayload, mount);
      } else {
        mount.innerHTML = '<div style="color:red; padding:20px; text-align:center;">未找到 renderHongbaoModal 方法，请检查 js/ui.js 是否正常加载。</div>';
      }

      // 启动实时遥测监控
      startTelemetry(gMin, gMax, totalTime);
    }

    function startTelemetry(gMin, gMax, totalTime) {
      if (teleTimer) clearInterval(teleTimer);
      const telePos = document.getElementById('tele-pos');
      const teleVel = document.getElementById('tele-vel');
      const teleZone = document.getElementById('tele-zone');
      const teleTime = document.getElementById('tele-time');

      let lastPos = 24;
      teleTimer = setInterval(() => {
        const pt = document.querySelector('#hb-sandbox-mount #hbPointer');
        const timerBar = document.querySelector('#hb-sandbox-mount #hbTimerBar');
        if (!pt) {
          clearInterval(teleTimer);
          return;
        }

        const leftStr = pt.style.left || '50%';
        const curPos = parseFloat(leftStr) || 50;
        const vel = (curPos - lastPos) / 0.05; // 单位 % / 秒
        lastPos = curPos;

        telePos.innerText = curPos.toFixed(1) + '%';
        teleVel.innerText = (vel >= 0 ? '+' : '') + vel.toFixed(1) + '%/s';

        if (curPos >= gMin && curPos <= gMax) {
          teleZone.innerText = '🌟 黄金平衡区';
          teleZone.className = 'tele-val good';
        } else if (curPos < gMin) {
          teleZone.innerText = '✋ 客套推脱区';
          teleZone.className = 'tele-val warn';
        } else {
          teleZone.innerText = '🤲 猴急直接夺';
          teleZone.className = 'tele-val danger';
        }

        if (timerBar) {
          const widthStr = timerBar.style.width || '100%';
          const pct = parseFloat(widthStr) / 100;
          const curTime = Math.max(0, totalTime * pct);
          teleTime.innerText = curTime.toFixed(1) + ' s';
          if (curTime <= 2.2) {
            teleTime.className = 'tele-val danger';
          } else {
            teleTime.className = 'tele-val';
          }
        }
      }, 50);
    }

    function recordTestResult(payload, arg, resText) {
      if (teleTimer) { clearInterval(teleTimer); teleTimer = null; }
      const pos = (typeof arg === 'object' && arg !== null && typeof arg.pos === 'number') ? arg.pos : 50;
      const isSkip = (typeof arg === 'object' && arg !== null && arg.skipped);

      stats.total++;
      let outcome = '得体收下';
      let tagClass = 'good';

      if (pos >= payload.goldenMin && pos <= payload.goldenMax) {
        stats.perfect++;
        outcome = '🌟 进退得体';
        tagClass = 'good';
      } else if (pos < Math.max(18, payload.goldenMin - 6)) {
        stats.refuse++;
        outcome = '✋ 推脱过猛 (0元)';
        tagClass = 'warn';
      } else if (pos > Math.min(82, payload.goldenMax + 8)) {
        stats.greed++;
        outcome = '🤲 过于急切 (扣面子)';
        tagClass = 'danger';
      } else {
        stats.normal++;
        outcome = '🧧 普通收下';
        tagClass = 'good';
      }

      // 提取获得的金额
      const mMatch = resText.match(/拿到\s*(\d+)\s*元/);
      const moneyGot = mMatch ? parseInt(mMatch[1], 10) : 0;
      stats.totalMoney += moneyGot;

      // 刷新统计表格
      document.getElementById('st-total').innerText = stats.total;
      document.getElementById('st-perfect').innerText = stats.perfect + ' (' + Math.round((stats.perfect / stats.total) * 100) + '%)';
      document.getElementById('st-refuse').innerText = stats.refuse + ' (' + Math.round((stats.refuse / stats.total) * 100) + '%)';
      document.getElementById('st-greed').innerText = stats.greed + ' (' + Math.round((stats.greed / stats.total) * 100) + '%)';
      document.getElementById('st-money').innerText = Math.round(stats.totalMoney / stats.total) + ' 元';

      // 插入历史流水
      const logBox = document.getElementById('history-log');
      if (stats.total === 1) logBox.innerHTML = '';
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML =
        '<span>#' + stats.total + ' <b>' + payload.rel + '</b> (' + outcome + (isSkip ? ' · 跳过' : '') + ') ➔ 落点: ' + pos + '%</span>' +
        '<span style="font-weight:700;' + (moneyGot > 0 ? 'color:#2e7d32' : 'color:#9e9e9e') + '">+' + moneyGot + '元</span>';
      logBox.insertBefore(entry, logBox.firstChild);
    }

    function renderSandboxSummary(payload, posVal, isSkip, resText) {
      if (teleTimer) { clearInterval(teleTimer); teleTimer = null; }
      const mount = document.getElementById('hb-sandbox-mount');
      if (!mount) return;

      const isPerfect = (posVal >= payload.goldenMin && posVal <= payload.goldenMax);
      const isRefuse = (posVal < Math.max(18, payload.goldenMin - 6));
      const isGreed = (posVal > Math.min(82, payload.goldenMax + 8));

      let badgeTitle = '🌟 进退得体 · 完美博弈';
      let icon = '✨';
      if (isPerfect) {
        badgeTitle = '🌟 进退得体 · 黄金得体区';
        icon = '✨';
      } else if (isRefuse) {
        badgeTitle = '✋ 客套过猛 · 长辈缩手';
        icon = '💨';
      } else if (isGreed) {
        badgeTitle = '🤲 过于猴急 · 亲妈怒视';
        icon = '💢';
      } else {
        badgeTitle = '🧧 顺利收下 · 中规中矩';
        icon = '🧧';
      }

      mount.innerHTML =
        '<div class="m-body hb-modal" style="text-align:center; padding: 22px 14px;">' +
          '<div style="font-size: 38px; margin-bottom: 6px;">' + icon + '</div>' +
          '<div class="m-title" style="margin-bottom: 6px;">' + payload.rel + ' 的红包对决结算</div>' +
          '<div style="margin-bottom: 12px;">' +
            '<span class="sandbox-tag" style="font-size: 13px; padding: 4px 10px;">' + badgeTitle + '</span>' +
          '</div>' +
          '<div style="background:var(--card-subtle); border:1px solid var(--border-line); border-radius:12px; padding:12px; margin: 12px 0; font-size:14px; line-height: 1.6; color:var(--ink-primary);">' +
            '<div><b>终局落点刻度：</b>' + posVal + '% (黄金平衡区: ' + payload.goldenMin + '% ~ ' + payload.goldenMax + '%)</div>' +
            '<div style="margin-top: 6px; font-size: 15px; font-weight:700; color: #2e7d32;">' + (resText || '对决已顺利敲定') + '</div>' +
          '</div>' +
          '<div class="btn-bar" style="margin-top: 16px;">' +
            '<button id="btn-sb-retry" class="btn primary">🔄 再试一局 (快捷键 R)</button>' +
            '<button id="btn-sb-next" class="btn secondary">🎲 换一个亲戚继续测</button>' +
          '</div>' +
        '</div>';

      const btnRetry = document.getElementById('btn-sb-retry');
      if (btnRetry) btnRetry.onclick = () => startSandboxTest();
      const btnNext = document.getElementById('btn-sb-next');
      if (btnNext) btnNext.onclick = () => {
        const nextIdx = (parseInt(document.getElementById('sel-rel').value, 10) + 1) % relativesData.length;
        document.getElementById('sel-rel').value = nextIdx;
        startSandboxTest(nextIdx);
      };
    }

    // 绑定按钮事件
    document.getElementById('btn-start-test').onclick = () => startSandboxTest();
    document.getElementById('btn-random-test').onclick = () => {
      const rIdx = Math.floor(Math.random() * relativesData.length);
      startSandboxTest(rIdx);
    };
    document.getElementById('btn-clear-stats').onclick = () => {
      stats = { total: 0, perfect: 0, refuse: 0, greed: 0, normal: 0, totalMoney: 0, history: [] };
      document.getElementById('st-total').innerText = '0';
      document.getElementById('st-perfect').innerText = '0 (0%)';
      document.getElementById('st-refuse').innerText = '0 (0%)';
      document.getElementById('st-greed').innerText = '0 (0%)';
      document.getElementById('st-money').innerText = '0 元';
      document.getElementById('history-log').innerHTML = '<div style="color:var(--ink-secondary); text-align:center; padding:12px;">暂无测试记录，点击上方“启动本轮红包测试”开始！</div>';
    };

    // 键盘 R 键快速重启测试
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
          e.preventDefault();
          startSandboxTest();
        }
      }
    });

    // 自动开局启动首测
    startSandboxTest(0);
  </script>
</body>
</html>
